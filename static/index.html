<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrewAI Travel Planner</title>
<style>body{font-family:Arial;background:#f0f7ff;margin:0;color:#17324d}main{max-width:820px;margin:32px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 28px #9ec5e880}h1{color:#0b5cad}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:14px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #b5cbe2;border-radius:7px;margin-top:5px}button{grid-column:span 2;background:#0b5cad;color:#fff;border:0;border-radius:8px;padding:12px;font-weight:bold;cursor:pointer}pre{white-space:pre-wrap;background:#f5f9fd;border-radius:10px;padding:16px;min-height:100px}small{color:#58708a}</style></head>
<body><main><h1>CrewAI Smart Travel Planner</h1><small>Local prototype. Tool data is mock unless you configure authorised external providers.</small><form id="form"><label>Destination<input name="destination" value="Jaipur" required></label><label>Starting location<input name="starting_location" value="Bengaluru" required></label><label>Dates<input name="travel_dates" value="15-18 November 2026" required></label><label>Duration (days)<input name="duration_days" type="number" value="3" min="1" required></label><label>Budget (₹)<input name="budget" type="number" value="50000" min="1" required></label><label>Interests<input name="interests" value="sightseeing, food, shopping" required></label><button>Create travel plan</button></form><h2>Travel plan</h2><pre id="output">Fill in your details and select Create travel plan.</pre></main>
<script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);data.duration_days=Number(data.duration_days);data.budget=Number(data.budget);const out=document.querySelector('#output');out.textContent='Planning...';const r=await fetch('/plan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const x=await r.json();out.textContent=`Engine: ${x.engine}\n\n${x.plan}${x.note?'\n\nNote: '+x.note:''}`}</script></body></html>
